dns: {}
policy_groups:
- select:
    name: PROXY
    policies:
    - Subscription
    flatten: true
    hidden: false
- external:
    name: Subscription
    type: fallback
rules:
- ip_cidr:
    match: 192.168.0.0/16
    policy: DIRECT
- ip_cidr:
    match: 10.0.0.0/8
    policy: DIRECT
- ip_cidr:
    match: 127.0.0.0/8
    policy: DIRECT
- ip_cidr:
    match: 172.16.0.0/12
    policy: DIRECT
- ip_cidr:
    match: 192.128.0.0/16
    policy: DIRECT
- ip_cidr:
    match: 224.0.0.0/24
    policy: DIRECT
- geoip:
    match: TH
    policy: DIRECT
- default:
    policy: PROXY
mitm:
  ca_p12: 
  ca_passphrase: egern
default_subscription_group: Subscription
default_proxy_group: PROXY
